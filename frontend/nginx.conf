server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routes must not 404 on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional explicit liveness probe for the load balancer
    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Preserve API paths and bearer headers when serving the same-origin SPA.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
